<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alpilles & Camargue Collection — cabinet de conseil privé en immobilier de prestige entre la Suisse et la Provence."
    />
    <!-- Site en construction : retirer cette ligne à l'ouverture publique. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Alpilles &amp; Camargue Collection — Conseil privé en immobilier de prestige</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Formulaire de détection Netlify.
      Netlify analyse le HTML au moment du build pour repérer les formulaires.
      Le site étant rendu par React, le vrai formulaire n'existe pas dans ce
      fichier : cette copie masquée sert uniquement à déclarer les champs.
      Toute modification des champs de Contact.tsx doit être répercutée ici.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="project"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
