# Configuration de déploiement Netlify
# Site statique produit par Vite : `npm run build` génère dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fonctions servant l'authentification du CMS (/admin).
# Chaque fonction déclare elle-même son chemin (/api/auth, /api/callback).
[functions]
  directory = "netlify/functions"

# Protection par mot de passe pendant la construction du site.
# Active uniquement si la variable SITE_PASSWORD est definie.
[edge_functions]
  directory = "netlify/edge-functions"

# Cache long sur les fichiers versionnés par Vite (hash dans le nom).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─────────────────────────────────────────────────────────────
# Domaines secondaires : tout est redirigé vers le .com, qui est
# l'adresse canonique. Évite le contenu dupliqué pour le référencement.
# ─────────────────────────────────────────────────────────────

[[redirects]]
  from = "https://alpillesetcamarguecollection.fr/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alpillesetcamarguecollection.fr/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alpillesetcamarguecollection.info/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alpillesetcamarguecollection.info/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alpillesetcamarguecollection.store/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alpillesetcamarguecollection.store/*"
  to = "https://alpillesetcamarguecollection.com/:splat"
  status = 301
  force = true
